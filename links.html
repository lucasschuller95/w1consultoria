<style>
  :root {
    /* paleta Série A – Verde-pinheiro (fundo claro); botão e borda da foto em #1C404A */
    --bg: #F1F4F3;
    --title: #0F1513;
    --role: #396A58;
    --text: #2E5245;
    --item: #0F1513;
    --icon: #49836E;
    --ring: #1C404A;
    --btn-bg: #1C404A;
    --btn-text: #F1F4F3;
    --btn-icon: #99BCB0;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 460px; padding: 40px 24px 40px; }
  .profile { display: flex; align-items: center; gap: 18px; }
  .profile img {
    width: 96px; height: 96px; flex: none;
    border-radius: 50%;
    object-fit: cover; object-position: center 20%;
    border: 3px solid var(--ring);
  }
  .profile h1 {
    font-family: "Playfair Display", Georgia, "Times New Roman", serif;
    font-size: 26px; font-weight: 700; line-height: 1.12; color: var(--title);
  }
  .profile p { margin-top: 6px; font-size: 15px; font-weight: 600; letter-spacing: .01em; color: var(--role); }
  .headline {
    margin-top: 36px;
    font-family: "Playfair Display", Georgia, "Times New Roman", serif;
    font-size: 32px; font-weight: 700; line-height: 1.15; color: var(--title);
  }
  .lead { margin-top: 14px; font-size: 16px; line-height: 1.6; color: var(--text); max-width: 30em; }
  .video-wrap { margin: 28px auto 0; width: 100%; max-width: 340px; aspect-ratio: 9 / 16; border-radius: 18px; overflow: hidden; background: var(--c-fallback, #1C404A); }
  .video-wrap video { display: block; width: 100%; height: 100%; object-fit: cover; }
  .btn {
    margin-top: 32px; width: 100%; min-height: 60px; padding: 16px 20px;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    border-radius: 16px; background: var(--btn-bg); color: var(--btn-text);
    font-size: 17px; font-weight: 700; text-decoration: none;
    transition: transform .15s ease;
  }
  .btn svg { width: 24px; height: 24px; flex: none; color: var(--btn-icon); }
  .btn:hover { transform: translateY(-2px); }
  .btn:focus-visible { outline: 3px solid var(--ring); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } .btn:hover { transform: none; } }
  @media (max-width: 360px) { .headline { font-size: 28px; } .profile img { width: 80px; height: 80px; } }
</style>
